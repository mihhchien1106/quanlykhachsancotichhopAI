services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:4000:4000"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      HOST: 0.0.0.0
      PORT: "4000"
      FRONTEND_ORIGIN: http://localhost:4000
    volumes:
      - hotel_data:/app/backend/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    security_opt:
      - no-new-privileges:true

volumes:
  hotel_data:
